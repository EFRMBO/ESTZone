<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Контакты</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="logo">EST<span>ZONE</span></a>
      <button class="burger" id="burger" aria-label="Меню">
        <span class="burger__line"></span>
        <span class="burger__line"></span>
        <span class="burger__line"></span>
      </button>
      <nav class="nav" id="nav">
        <a href="index.html" class="nav__link">Главная</a>
        <a href="tariffs.html" class="nav__link">Тарифы</a>
        <a href="seats.html" class="nav__link">Места</a>
        <a href="contacts.html" class="nav__link active">Контакты</a>
      </nav>
    </div>
  </header>

  <main class="container page-padding">
    <h1 class="page-title">СВЯЗАТЬСЯ С НАМИ</h1>

    <div class="contacts-layout">
      
      <div class="contacts-info">
        <h2>ИНФОРМАЦИЯ</h2>
        <div class="info-block">
          <p class="info-label">📍 Адрес:</p>
          <p class="info-value">Tallinn, Viru väljak 4, 10111</p>
        </div>
        <div class="info-block">
          <p class="info-label">📞 Телефон:</p>
          <p class="info-value">+372 555 5555</p>
        </div>
        <div class="info-block">
          <p class="info-label">✉️ Email:</p>
          <p class="info-value">info@estzone.ee</p>
        </div>
      </div>


      <div class="contacts-form">
        <h2>НАПИСАТЬ СООБЩЕНИЕ</h2>

        <form class="pure-form" id="contact-form">
          <div class="form-group">
            <label for="form-name">Ваше имя</label>
            <input type="text" id="form-name" placeholder="Введите имя..." />
          </div>
          <div class="form-group">
            <label for="form-email">Ваш Email</label>
            <input type="email" id="form-email" placeholder="Введите почту..." />
          </div>
          <div class="form-group">
            <label for="form-msg">Сообщение</label>
            <textarea id="form-msg" placeholder="Введите  текст..." rows="5"></textarea>
          </div>
          <button type="submit" class="btn btn--primary">Отправить сообщение →</button>
        </form>

        <div class="form-success-msg" id="success-msg">
          ✅ Сообщение отправлено! Мы свяжемся с вами в ближайшее время.
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span class="logo">EST<span>ZONE</span></span>
      <p class="footer__copy">© 2026 ESTZone.</p>
    </div>
  </footer>

  <script>
    var burger = document.getElementById("burger");
    var nav = document.getElementById("nav");

    burger.addEventListener("click", function() {
      burger.classList.toggle("open");
      nav.classList.toggle("open");
    });

    nav.querySelectorAll(".nav__link").forEach(function(link) {
      link.addEventListener("click", function() {
        burger.classList.remove("open");
        nav.classList.remove("open");
      });
    });

    var form = document.getElementById("contact-form");
    var successMsg = document.getElementById("success-msg");

    form.addEventListener("submit", function(e) {
      e.preventDefault(); 
      var isValid = true;

      var oldErrors = document.querySelectorAll(".field-error");
      oldErrors.forEach(function(el) { el.remove(); });

      var inputs = form.querySelectorAll("input, textarea");
      inputs.forEach(function(el) {
        el.classList.remove("error");
        el.classList.remove("success");
      });

            var nameInput = document.getElementById("form-name");
      if (nameInput.value.trim().length < 2) {
        showError(nameInput, "Введите имя (минимум 2 символа)");
        isValid = false;
      } else {
        nameInput.classList.add("success");
      }

      var emailInput = document.getElementById("form-email");
      var emailVal = emailInput.value.trim();
      var atPos = emailVal.indexOf("@");
      var dotPos = emailVal.lastIndexOf(".");
      if (atPos < 1 || dotPos < atPos + 2 || dotPos === emailVal.length - 1) {
        showError(emailInput, "Введите корректный email адрес");
        isValid = false;
      } else {
        emailInput.classList.add("success");
      }

      var msgInput = document.getElementById("form-msg");
      if (msgInput.value.trim().length < 10) {
        showError(msgInput, "Сообщение слишком короткое (минимум 10 символов)");
        isValid = false;
      } else {
        msgInput.classList.add("success");
      }

        if (isValid) {
        form.style.display = "none";
        successMsg.style.display = "block";
      }
    });

      function showError(input, message) {
      input.classList.add("error");
      var errorEl = document.createElement("p");
      errorEl.className = "field-error";
      errorEl.textContent = message;
      input.parentNode.appendChild(errorEl);
    }
  </script>

</body>
</html>
